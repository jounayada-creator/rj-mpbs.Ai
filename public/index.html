<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ MPBS AI - Global Multi-Agent Platform</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card: #111827;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #loginModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.95); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .login-box {
            background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 20px;
            width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .login-box h1 { color: #fff; margin-bottom: 8px; font-size: 1.6rem; }
        .login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 12px 16px; background: #1a2234; border: 1px solid var(--border);
            border-radius: 10px; color: #fff; margin-bottom: 16px; outline: none; font-size: 0.95rem;
        }
        .login-box button {
            width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
            border-radius: 10px; font-weight: 600; cursor: pointer;
        }

        header {
            background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; color: #fff; }
        
        /* কাস্টম লোগো ডিজাইন */
        .brand-logo-img {
            width: 38px; height: 38px; border-radius: 10px; object-fit: cover;
            border: 2px solid var(--primary); background: #1a2234;
        }

        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        select, input.api-input, button.tool-btn {
            background: #1a2234; color: #fff; border: 1px solid var(--border); padding: 6px 10px;
            border-radius: 6px; outline: none; font-size: 0.8rem; cursor: pointer;
        }
        input.api-input { width: 160px; cursor: text; }

        .main-layout { flex: 1; display: flex; max-width: 1350px; width: 100%; margin: 0 auto; padding: 15px; gap: 15px; overflow: hidden; }

        .agent-panel {
            width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; gap: 12px;
        }
        .avatar-box { width: 70px; height: 70px; border-radius: 16px; overflow: hidden; border: 2px solid var(--primary); background: #1a2234; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .agent-name { font-size: 1rem; font-weight: 600; color: #fff; }
        .agent-status { font-size: 0.7rem; color: var(--accent); background: rgba(16, 185, 129, 0.1); padding: 3px 10px; border-radius: 20px; }

        .chat-panel { flex: 1; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 0.9rem; word-break: break-word; }
        .user-msg { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #1a2234; color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border); }
        .ai-msg img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .preview-frame { width: 100%; height: 220px; border: 1px solid var(--border); border-radius: 8px; background: #fff; margin-top: 10px; }

        .input-bar { display: flex; gap: 8px; padding: 12px 16px; background: #0b0f19; border-top: 1px solid var(--border); align-items: center; }
        .input-bar input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.95rem; }
        .input-bar input:focus { border-color: var(--primary); }
        
        .action-icon-btn {
            background: #1a2234; border: 1px solid var(--border); border-radius: 8px; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .action-icon-btn:hover { border-color: var(--primary); background: rgba(99,102,241,0.1); }
        .action-icon-btn svg { width: 18px; height: 18px; fill: var(--text-muted); }
        
        .send-icon-btn {
            background: var(--primary); border: none; border-radius: 8px; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .send-icon-btn:hover { background: var(--primary-hover); }
        .send-icon-btn svg { width: 18px; height: 18px; fill: #fff; }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="login-box">
            <h1>RJ MPBS AI</h1>
            <p>Enter your Gmail to start workspace</p>
            <input type="email" id="userEmail" placeholder="name@example.com">
            <button onclick="loginUser()">Continue</button>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <!-- আপনার কাস্টম লোগো ছবি -->
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&h=100&fit=crop" class="brand-logo-img" alt="Logo">
            RJ MPBS AI Platform
        </div>
        <div class="toolbar">
            <input type="password" id="apiKeyInput" class="api-input" placeholder="🔑 API Key">
            <select id="langSelect">
                <option value="auto">🌐 Auto Match</option>
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
            </select>
            <button class="tool-btn" onclick="quickAction('sticker')">🎨 Sticker</button>
            <button class="tool-btn" onclick="quickAction('app')">🚀 Publish App</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="agent-panel">
            <div class="avatar-box">
                <!-- এজেন্ট প্যানেলের কাস্টম ছবি -->
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200&h=200&fit=crop" alt="Agent">
            </div>
            <div class="agent-name">RJ Intelligence</div>
            <div class="agent-status">● Online</div>
        </div>

        <div class="chat-panel">
            <div class="chat-messages" id="chatBox">
                <div class="msg ai-msg">Hello! How can I assist you today? Type "Hi" or ask anything.</div>
            </div>

            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Message RJ MPBS AI..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="action-icon-btn" onclick="startVoiceInput()" title="Voice">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.23 14.47 16 12 16s-4.52-1.77-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                </button>
                <button class="send-icon-btn" onclick="sendMessage()" title="Send">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let loggedEmail = "";

        function loginUser() {
            const email = document.getElementById('userEmail').value.trim();
            if(!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }
            loggedEmail = email;
            document.getElementById('loginModal').style.display = 'none';
        }

        function quickAction(type) {
            if(type === 'sticker') {
                document.getElementById('userInput').value = "Create a modern custom sticker design concept.";
            } else if(type === 'app') {
                document.getElementById('userInput').value = "Build and publish a professional web application code.";
            }
            sendMessage();
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert('Voice input not supported.');
            const recognition = new SpeechRecognition();
            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendMessage();
            };
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = inputField.value.trim();
            const userApiKey = document.getElementById('apiKeyInput').value.trim();
            const selectedLang = document.getElementById('langSelect').value;

            if(!message) return;

            chatBox.innerHTML += `<div class="msg user-msg">${escapeHtml(message)}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            let actionType = 'chat';
            if(message.toLowerCase().includes('sticker') || message.toLowerCase().includes('design')) actionType = 'image';
            if(message.toLowerCase().includes('app') || message.toLowerCase().includes('publish') || message.toLowerCase().includes('portfolio')) actionType = 'website';

            try {
                const res = await fetch('/api/ai-core', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, language: selectedLang, apiKey: userApiKey, actionType: actionType })
                });
                const data = await res.json();
                
                let replyHTML = `<div class="msg ai-msg">${escapeHtml(data.reply)}`;
                if(data.mediaGenerated) replyHTML += `<br><img src="${data.mediaGenerated}">`;
                if(data.publishedCode) replyHTML += `<br><iframe class="preview-frame" srcdoc="${escapeHtml(data.publishedCode)}"></iframe>`;
                replyHTML += `</div>`;
                
                chatBox.innerHTML += replyHTML;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg ai-msg">Connection error occurred.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
